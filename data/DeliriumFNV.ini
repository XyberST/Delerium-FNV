; DeliriumFNV settings. Needs FalloutNV.exe 1.4.0.525 and xNVSE.
[General]
Enabled=1
; Write the Delirium body into dying NPCs' bones. 0 = watch only, never touch the game.
Drive=1
; Only take over actors that are dying or dead (not knocked-down or essential NPCs). 0 = any ragdoll start.
RequireDead=1
; How many corpses can be simulated at the same time, seconds of simulation, then seconds the final pose is held.
MaxActors=4
SimSeconds=8
HoldSeconds=300
; Scale the speed the body inherits from the game's own ragdoll (1.0 = as the game did it, 0 = no inherited motion), and how much "health" the dying body is given (lower collapses faster).
VelocityScale=1.0
ShotHealth=1.0
; Switch the game's own (now invisible) ragdoll bodies to keyframed so they follow the visible body: loot, crosshair and bullets then hit it.
KeyframeGameBodies=1
; Off for now: handing the bodies back can stretch the lower torso. 1 = when a corpse comes to rest, give its bodies back to the game so it can be grabbed and dragged like a vanilla one
ReleaseAtRest=0
; A corpse counts as at rest, and is released, once every part has moved slower than RestSpeed (m/s) for RestFrames frames in a row (never before frame 90).
RestSpeed=1.5
RestFrames=30
; Leave actors with cut-off limbs entirely to the game (the vanilla dismemberment looks right; ours stretched and lost heads).
SkipDismembered=1
; Startup self test of the engine (3 s balance and a shot). Logs the result.
SmokeTest=0

[World]
; Experimental, off by default. Collision=1 samples the floor, beds, stairs and props around each corpse with the game's ray cast
; and lets the Delirium body land on them instead of a flat floor. If too few rays hit it falls back to the flat floor by itself.
Collision=1
; Calibrate=1 logs, once per run, which ray layers see the floor and which see the actor (64 layers, sent to the log). Use it to pick GroundFilter.
Calibrate=1
; Ray filter: 0x011F0000 plus the layer number. 0x011F0025 is what the game itself uses for its crosshair pick.
; auto = pick the layer from the calibration, or give a fixed value such as 0x011F0025
GroundFilter=auto
; Grid: cell size in metres and cells each side of the corpse (10 means 21 by 21 samples, about 3.5 m around).
GroundCell=0.35
GroundHalf=10

; Hooks the plugin needs: the per-hit function and the motion-type setter (death detection), plus bhkWorld slots (any call tells
; the plugin which physics world is current). Format: Label=vtable,slot
[SlotProbes]
Character[206]=0x01086A6C,206
bhkBlendCollisionObject[44]=0x010C53DC,44
bhkWorld[50]=0x010C40B4,50
bhkWorld[2]=0x010C40B4,2
bhkWorld[10]=0x010C40B4,10
bhkWorld[20]=0x010C40B4,20
bhkWorld[30]=0x010C40B4,30
bhkWorld[40]=0x010C40B4,40
