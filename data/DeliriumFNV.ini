; DeliriumFNV. Addresses are for FalloutNV.exe 1.4.0.525. NVSE or other plugins may patch some functions; a function probe is skipped if its bytes differ.
[General]
SmokeTest=1
Probes=1
; Take over dying NPCs with a Delirium body, then write it into their bones. Observe=0 turns the whole feature off.
Observe=1
; Drive=0: only watch and log, never touch the game.
Drive=1
; Only take over actors that are dying or dead (not knocked-down or essential NPCs). 0 = any ragdoll start.
RequireDead=1
; How many corpses can be simulated at the same time, seconds of simulation, then seconds the final pose is held.
MaxActors=4
SimSeconds=8
HoldSeconds=300
; Discovery hotkeys (mark / dump probe hits): 0 = off. Insert=45, Delete=46.
Hotkeys=0
MarkKey=45
DumpKey=46

; The two probes the death takeover needs: the per-hit function and the motion-type setter. Format: Label=vtable,slot
[SlotProbes]
Character[206]=0x01086A6C,206
bhkBlendCollisionObject[44]=0x010C53DC,44
