; DeliriumFNV settings. Needs FalloutNV.exe 1.4.0.525 and xNVSE.
[General]
Enabled=1
; Write the Delirium body into dying NPCs' bones. 0 = watch only, never touch the game.
Drive=1
; Only take over actors that are dying or dead (not knocked-down or essential NPCs). 0 = any ragdoll start.
RequireDead=1
; How many corpses can be simulated at the same time, seconds of simulation, then seconds the final pose is held.
MaxActors=4
SimSeconds=8
HoldSeconds=300
; Scale the speed the body inherits from the game's own ragdoll (1.0 = as the game did it, 0 = no inherited motion), and how much "health" the dying body is given (lower collapses faster).
VelocityScale=1.0
ShotHealth=1.0
; Switch the game's own (now invisible) ragdoll bodies to keyframed so they follow the visible body: loot, crosshair and bullets then hit it.
KeyframeGameBodies=1
; Off for now: handing the bodies back can stretch the lower torso. 1 = when a corpse comes to rest, give its bodies back to the game so it can be grabbed and dragged like a vanilla one
; 1 = drive the game's own ragdoll bodies by velocity (collision, looting and grabbing come from the game). 0 = write bones, keyframe the game's bodies.
DriveGameBodies=1
DriveGain=1.0
DriveMaxSpeed=8
; How strongly the bodies are turned toward Delirium's orientation (moving uses DriveGain). Lower = fewer odd contortions.
DriveAngularGain=0.4
; Dying bodies that were not thrown hard and still have their head stay on their feet and stumble for a moment, like a euphoria ragdoll, then run out of strength and go down.
; BalanceSeconds: how long they fight (randomised +-30%). BalanceFallSeconds: how long they then take to go limp. BalanceSteps: how many stumbling steps they may take.
; BalanceHealth: the engine's health while balancing. 100 or more keeps the body upright until BalanceSeconds is up (what you want); below 100 it starts going limp at once.
; BalanceMaxSpeed: a body thrown faster than this (m/s) by the kill does not balance. BalanceVelocityScale: how much of the kill's motion a balancing body inherits (0.5 = half).
; BalancePush: 1 = the engine's standard shot push on top (it decides the stumble direction), 0 = none.
BalanceWhenDying=1
BalanceHealth=120
BalanceSeconds=2.5
BalanceFallSeconds=1.0
BalanceSteps=8
BalanceMaxSpeed=6
BalanceVelocityScale=0.5
BalancePush=1
; Hit location (like Max Payne 3): the part of the body the killing shot hit is found from which part the game kicked hardest, and given to the engine's shot reaction.
; The engine then reacts to the part: a hit leg buckles, a hit arm spins and clutches, the spine arches and so on. The multipliers below scale how long a body hit
; there keeps fighting (BalanceSeconds x multiplier); 0 = collapses at once. HitMinKick: below this kick (m/s) the hit is treated as a chest hit.
HitLocationAware=1
HitMinKick=1.0
HeadHitBalance=0.0
TorsoHitBalance=1.0
PelvisHitBalance=0.8
LegHitBalance=0.4
ArmHitBalance=1.3
; 1 = kills with a cut-off limb get Delirium too: the cut-off parts are left to the game and the rest is driven (needs DriveGameBodies=1).
DismemberedGetDelirium=1
; Press this key in the game to re-read this file (virtual-key code, 0x79 = F10, 0 = off).
ReloadKey=0x79
ReleaseAtRest=0
; A corpse counts as at rest, and is released, once every part has moved slower than RestSpeed (m/s) for RestFrames frames in a row (never before frame 90).
RestSpeed=1.5
RestFrames=30
; Leave actors with cut-off limbs entirely to the game (the vanilla dismemberment looks right; ours stretched and lost heads).
SkipDismembered=1
; Startup self test of the engine (3 s balance and a shot). Logs the result.
SmokeTest=0

[World]
; Experimental, off by default. Collision=1 samples the floor, beds, stairs and props around each corpse with the game's ray cast
; and lets the Delirium body land on them instead of a flat floor. If too few rays hit it falls back to the flat floor by itself.
Collision=1
; Calibrate=1 logs, once per run, which ray layers see the floor and which see the actor (64 layers, sent to the log). Use it to pick GroundFilter.
Calibrate=1
; Ray filter: 0x011F0000 plus the layer number. 0x011F0025 is what the game itself uses for its crosshair pick.
; auto = pick the layer from the calibration, or give a fixed value such as 0x011F0025
GroundFilter=auto
; Grid: cell size in metres and cells each side of the corpse (10 means 21 by 21 samples, about 3.5 m around).
GroundCell=0.35
GroundHalf=10

; Hooks the plugin needs: the per-hit function and the motion-type setter (death detection), plus bhkWorld slots (any call tells
; the plugin which physics world is current). Format: Label=vtable,slot
[SlotProbes]
Character[206]=0x01086A6C,206
bhkBlendCollisionObject[44]=0x010C53DC,44
bhkWorld[50]=0x010C40B4,50
bhkWorld[2]=0x010C40B4,2
bhkWorld[10]=0x010C40B4,10
bhkWorld[20]=0x010C40B4,20
bhkWorld[30]=0x010C40B4,30
bhkWorld[40]=0x010C40B4,40

[Drive]
; How the game's own bodies are pulled toward Delirium's pose. Tau: time constant in seconds (bigger = softer). SoftAbove: mean distance (game units) above which the pull is
; softened. MaxCatchUp: never close more than this many units at once. MaxAngular: rad/s. GiveUpDistance / GiveUpSeconds: when the bodies stay this far from the target the
; corpse is left to the game (blocked by a wall, for instance).
Tau=0.06
SoftAbove=60
MaxCatchUp=50
MaxAngular=10
GiveUpDistance=220
GiveUpSeconds=0.5

[Timing]
; A corpse is at rest when it has fallen and every part has moved slower than RestSpeed (General) for RestSeconds, but never before RestMinSeconds. HiddenScale: a bone scaled
; below this fraction counts as cut off.
RestSeconds=0.5
RestMinSeconds=1.5
HiddenScale=0.2

[Performance]
; SimRate: the engine steps at most this many times per second however high the frame rate is (0 = every frame). MaxDistance: corpses farther than this (game units, about 70 per
; metre) from the player are left to the game (0 = no limit). MinFps: below this frame rate new corpses are left to the game (0 = off). Profile=1 logs what each corpse cost.
SimRate=60
MaxDistance=4000
MinFps=25
Profile=1

[Reactions]
; Burning. A corpse counts as burning when its actor carries a node whose name contains one of BurnKeywords, or (BurnByDamageTicks) when it took DamageTicks hits within DamageWindow
; seconds without a kill impulse (fire, poison and radiation all do this). It staggers for BurnBalanceSeconds with its arms windmilling, then writhes for BurnFlailSeconds.
Burn=1
BurnByDamageTicks=1
DamageTicks=3
DamageWindow=6
BurnBalanceSeconds=1.2
BurnFlailSeconds=4.0
BurnKeywords=
; Shock / plasma: convulses. Needs ShockKeywords (see DumpNodes) because the game does not tell us the damage type.
Shock=1
ShockBalanceSeconds=0.6
ShockSeconds=2.5
ShockKeywords=
; DumpNodes=1 logs, for the first four corpses, every node of the actor that is not part of the skeleton. Burn a few NPCs, then look in the log for names such as fire or flame
; and put them in BurnKeywords.
DumpNodes=1
; Thrown by a blast (kicked faster than BalanceMaxSpeed): windmill, pedal or writhe in the air for ExplosionSeconds.
Explosion=1
ExplosionSeconds=1.6
ExplosionRollChance=0.3
ExplosionWritheChance=0.3
; Hit in the pelvis or lower spine: folds over and curls up as it goes down.
GutCurl=1
GutCurlChance=0.6
GutCurlSeconds=2.5
; Dying more than FallMinHeight units above the floor: arms flail on the way down, and with FallCatchChance it braces for the landing.
Fall=1
FallMinHeight=100
FallCatchChance=0.5
; Strength and size of the flailing, shared by all of the above.
FlailStiffness=12
FlailAmplitude=1.3
FlailPeriod=0.8

[EngineParams]
; Any parameter of the Delirium engine, written Task.parameter=value, applied at start-up and on every reload. For example:
; NMShot_Standing.shotBodyStiffness=14
; NMShot_Standing.shotLeanAmount=0.4
; (BalanceSteps overrides NMShot_Standing.shotMaxSteps on every kill.)
