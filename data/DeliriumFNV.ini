; DeliriumFNV settings. Needs FalloutNV.exe 1.4.0.525 and xNVSE.
[General]
Enabled=1
; Write the Delirium body into dying NPCs' bones. 0 = watch only, never touch the game.
Drive=1
; Only take over actors that are dying or dead (not knocked-down or essential NPCs). 0 = any ragdoll start.
RequireDead=1
; How many corpses can be simulated at the same time, seconds of simulation, then seconds the final pose is held.
MaxActors=4
SimSeconds=8
HoldSeconds=300
; Scale the speed the body inherits from the game's own ragdoll (1.0 = as the game did it, 0 = no inherited motion), and how much "health" the dying body is given (lower collapses faster).
VelocityScale=1.0
ShotHealth=1.0
; Switch the game's own (now invisible) ragdoll bodies to keyframed so they follow the visible body: loot, crosshair and bullets then hit it.
KeyframeGameBodies=1
; Off for now: handing the bodies back can stretch the lower torso. 1 = when a corpse comes to rest, give its bodies back to the game so it can be grabbed and dragged like a vanilla one
; 1 = drive the game's own ragdoll bodies by velocity (collision, looting and grabbing come from the game). 0 = write bones, keyframe the game's bodies.
DriveGameBodies=1
DriveGain=1.0
DriveMaxSpeed=8
; How strongly the bodies are turned toward Delirium's orientation (moving uses DriveGain). Lower = fewer odd contortions.
DriveAngularGain=0.4
; Dying bodies that were not thrown hard and still have their head stay on their feet and stumble for a moment, like a euphoria ragdoll, then run out of strength and go down.
; BalanceSeconds: how long they fight (randomised +-30%). BalanceFallSeconds: how long they then take to go limp. BalanceSteps: how many stumbling steps they may take.
; BalanceHealth: the engine's health while balancing. 100 or more keeps the body upright until BalanceSeconds is up (what you want); below 100 it starts going limp at once.
; BalanceMaxSpeed: a body thrown faster than this (m/s) by the kill does not balance. BalanceVelocityScale: how much of the kill's motion a balancing body inherits (0.5 = half).
; BalancePush: 1 = the engine's standard shot push on top (it decides the stumble direction), 0 = none.
BalanceWhenDying=1
BalanceHealth=120
BalanceSeconds=2.5
BalanceFallSeconds=1.0
BalanceSteps=8
BalanceMaxSpeed=6
BalanceVelocityScale=0.5
BalancePush=1
; Hit location (like Max Payne 3): the part of the body the killing shot hit is found from which part the game kicked hardest, and given to the engine's shot reaction.
; The engine then reacts to the part: a hit leg buckles, a hit arm spins and clutches, the spine arches and so on. The multipliers below scale how long a body hit
; there keeps fighting (BalanceSeconds x multiplier); 0 = collapses at once. HitMinKick: below this kick (m/s) the hit is treated as a chest hit.
HitLocationAware=1
HitMinKick=1.0
HeadHitBalance=0.0
TorsoHitBalance=1.0
PelvisHitBalance=0.8
LegHitBalance=0.4
ArmHitBalance=1.3
; 1 = kills with a cut-off limb get Delirium too: the cut-off parts are left to the game and the rest is driven (needs DriveGameBodies=1).
DismemberedGetDelirium=1
; Press this key in the game to re-read this file (virtual-key code, 0x79 = F10, 0 = off).
ReloadKey=0x79
ReleaseAtRest=0
; A corpse counts as at rest, and is released, once every part has moved slower than RestSpeed (m/s) for RestFrames frames in a row (never before frame 90).
RestSpeed=1.5
RestFrames=30
; Leave actors with cut-off limbs entirely to the game (the vanilla dismemberment looks right; ours stretched and lost heads).
SkipDismembered=1
; Startup self test of the engine (3 s balance and a shot). Logs the result.
SmokeTest=0

[World]
; Experimental, off by default. Collision=1 samples the floor, beds, stairs and props around each corpse with the game's ray cast
; and lets the Delirium body land on them instead of a flat floor. If too few rays hit it falls back to the flat floor by itself.
Collision=1
; Calibrate=1 logs, once per run, which ray layers see the floor and which see the actor (64 layers, sent to the log). Use it to pick GroundFilter.
Calibrate=1
; Ray filter: 0x011F0000 plus the layer number. 0x011F0025 is what the game itself uses for its crosshair pick.
; auto = pick the layer from the calibration, or give a fixed value such as 0x011F0025
GroundFilter=auto
; Grid: cell size in metres and cells each side of the corpse (10 means 21 by 21 samples, about 3.5 m around).
GroundCell=0.35
GroundHalf=10
; Follow: the ground mesh is only a snapshot of the floor around the spot where the actor died (about 3.5 m wide and 1 m deep), so a body that tumbles down stairs or a slope
; ends up past its edge on a flat floor and hangs in the air. With Follow=1 a new mesh is built around the body (a few rays a frame) once it has moved FollowDistance (a fraction
; of the mesh's reach) from the centre of the last one, or dropped near the bottom of its height window.
Follow=1
FollowDistance=0.45

; Hooks the plugin needs: the per-hit function and the motion-type setter (death detection), plus bhkWorld slots (any call tells
; the plugin which physics world is current). Format: Label=vtable,slot
[SlotProbes]
Character[206]=0x01086A6C,206
; Creatures (feral ghouls, mutants, animals) have a vtable of their own (0x010870AC); without this line their deaths are never noticed.
Creature[206]=0x010870AC,206
; The player has a vtable of its own (PlayerCharacter, 0x0108AA3C); without this line the player's death is never noticed.
; The player (a PlayerCharacter has its own vtable). Only taken over when the game really ragdolls the player body (see PlayerDeath in [Reactions]).
PlayerCharacter[206]=0x0108AA3C,206
bhkBlendCollisionObject[44]=0x010C53DC,44
; PushActorAway (process vtable slot 262: actor, source point, force): called for explosions and the script command, so knockdowns are noticed the moment they begin.
HighProcess[262]=0x01087864,262
MiddleHighProcess[262]=0x0108904C,262
; Impulses applied to a dynamic rigid body's motion (slot 19 linear, slot 20 at a point): bullets hitting a corpse, other mods (Involuntary Discharge recoil). Delirium feeds them into its simulation.
MotionImpulse_Sphere[19]=0x010C6D54,19
MotionImpulse_Sphere[20]=0x010C6D54,20
MotionImpulse_Box[19]=0x010C6DC4,19
MotionImpulse_Box[20]=0x010C6DC4,20
MotionImpulse_ThinBox[19]=0x010C6E34,19
MotionImpulse_ThinBox[20]=0x010C6E34,20
MotionImpulse_Character[19]=0x010C6EA4,19
MotionImpulse_Character[20]=0x010C6EA4,20
bhkWorld[50]=0x010C40B4,50
bhkWorld[2]=0x010C40B4,2
bhkWorld[10]=0x010C40B4,10
bhkWorld[20]=0x010C40B4,20
bhkWorld[30]=0x010C40B4,30
bhkWorld[40]=0x010C40B4,40

[Drive]
; Resync: the Delirium body has no walls, so one pressed into a wall tries to go through it while the game's bodies are stopped, and pulling them toward it stretches the ragdoll.
; When the game's bodies are on average more than ResyncMean game units (70 = 1 m) from their targets, or one is more than ResyncMax, for a few frames, the simulation is moved to
; where the bodies really are (it keeps ResyncKeep of its speed), at most once every ResyncGap seconds. After ResyncGiveUp resyncs the corpse is left to the game.
Resync=1
ResyncMean=25
ResyncMax=60
ResyncMin=12
ResyncGap=0.25
ResyncKeep=0.75
ResyncGiveUp=14
; How the game's own bodies are pulled toward Delirium's pose. Tau: time constant in seconds (bigger = softer). SoftAbove: mean distance (game units) above which the pull is
; softened. MaxCatchUp: never close more than this many units at once. MaxAngular: rad/s. GiveUpDistance / GiveUpSeconds: when the bodies stay this far from the target the
; corpse is left to the game (blocked by a wall, for instance).
Tau=0.06
SoftAbove=60
MaxCatchUp=50
MaxAngular=10
GiveUpDistance=220
GiveUpSeconds=0.5

[Timing]
; A corpse is at rest when it has fallen and every part has moved slower than RestSpeed (General) for RestSeconds, but never before RestMinSeconds. HiddenScale: a bone scaled
; below this fraction counts as cut off.
RestSeconds=0.5
RestMinSeconds=1.5
HiddenScale=0.2

[Impulse]
; Multipliers on the motion the game gives a body when it dies or is knocked down (the "kill impulse"), by what did it. 1 = as the game made it; the explosion default is 3, three times vanilla.
; All multiplies every class. Bullet and Melee are decided by the weapon of the killing hit (HitData=1), Explosion is a grenade, launcher or mine, a blast that threw the body or a knockdown with the
; "explode" state; Knockdown is a knocked-out or unconscious actor, Other everything else (falls).
All=1.0
Bullet=1.0
Melee=1.0
Explosion=3.0
Knockdown=1.0
Other=1.0
; Player: the multiplier for your own death (it replaces the class multipliers; All still applies). MaxLaunchSpeed: no body part is launched faster than this (m/s), whatever the multipliers say.
; BlastSpeed: when the killing weapon is unknown, a kill that throws the chest faster than this (m/s, as the game made it) is treated as a blast; a known weapon, a PushActorAway
; on the actor or an "explode" knockdown decide first.
Player=1.0
MaxLaunchSpeed=35
BlastSpeed=14

[Shooting]
; Shooting an actor that is still dying on its feet in the Delirium state: a single or slow shot brings it down sooner (the time it has left is multiplied by Shorten), rapid fire (shots closer
; than RapidWindow seconds) keeps it up Extend seconds longer per shot, up to MaxExtend in all, while the bullets knock it about. A shot with no impulse of its own pushes Push.
ShotReact=1
RapidWindow=0.35
Extend=1.5
MaxExtend=4.0
Shorten=0.35
Push=12.0
; TapImpulses: impulses the game applies to a Delirium body (a bullet on a corpse, the recoil of Involuntary Discharge, an explosion) are fed into the simulation, scaled by TapFeed; below TapMinImpulse they are ignored.
TapImpulses=1
TapFeed=1.0
TapMinImpulse=0.05

[Scripts]
; Ragdoll reactions you can rewrite: File lists timed engine messages that replace a built-in reaction (Explosion, Fall, Burn, Shock, Gut, Agony, ...).
; See DeliriumFNV_reactions.txt for the format and DeliriumFNV_messages.txt for every message and parameter the engine understands. F10 reloads it.
Enabled=1
File=DeliriumFNV_reactions.txt
; Ymt: a GTA V physicstasks.ymt. A script line "import CTaskNMHighFall/Start" pulls in the messages of that task state that the engine understands.
; Put your copy of the file in the plugin folder (it is not shipped with the mod).
Ymt=physicstasks.ymt

[Actors]
; Creatures: actors of the Creature class (ghouls, mutants, animals) may get Delirium when they have a humanoid skeleton (feral ghouls lack some spine bones, which are substituted).
Creatures=1
; LargeActors: actors much bigger than a human (super mutants, about 1.4 times the player) may get Delirium. Their skeleton is larger than the rig was made for, so it can look odd: 0 leaves them to the game.
; LargeScale: an actor counts as large when its leg bones are this many times the player's length (the log shows each actor's ratio).
LargeActors=1
LargeScale=1.2

[Performance]
; SimRate: the engine steps at most this many times per second however high the frame rate is (0 = every frame). MaxDistance: corpses farther than this (game units, about 70 per
; metre) from the player are left to the game (0 = no limit). MinFps: below this frame rate new corpses are left to the game (0 = off). Profile=1 logs what each corpse cost.
SimRate=60
MaxDistance=4000
MinFps=25
Profile=1
; Lod: ragdolls farther than LodNear (game units, 70 = 1 m) from the player step LodRateMid times a second, beyond LodMid LodRateFar times a second.
Lod=1
LodNear=900
LodMid=2200
LodRateMid=30
LodRateFar=20
; FrameBudgetMs: the plugin time per frame it aims for. Over it every step rate drops (down to 12 a second) and, with 3 or more ragdolls running,
; new ones are left to the game until there is room again (0 = no limit).
FrameBudgetMs=2.5
; FloorHalfMesh / FloorHalfFlat: half size in metres of the safety floor each ragdoll gets (under the ground mesh / when there is no mesh). The engine builds it from two triangles
; per square metre, so the old fixed 100 cost about 30 ms for every new ragdoll. Raise them only if bodies thrown very far fall through the world.
FloorHalfMesh=12
FloorHalfFlat=20

[Reactions]
; Burning. A corpse counts as burning when its actor carries a node whose name contains one of BurnKeywords, or (BurnByDamageTicks) when it took DamageTicks hits within DamageWindow
; seconds without a kill impulse (fire, poison and radiation all do this). It staggers for BurnBalanceSeconds with its arms windmilling, then writhes for BurnFlailSeconds.
Burn=1
BurnByDamageTicks=1
DamageTicks=3
DamageWindow=6
BurnBalanceSeconds=1.2
BurnFlailSeconds=4.0
BurnKeywords=
; Shock / plasma: convulses. Needs ShockKeywords (see DumpNodes) because the game does not tell us the damage type.
Shock=1
ShockBalanceSeconds=0.6
ShockSeconds=2.5
ShockKeywords=
; DumpNodes=1 logs, for the first four corpses, every node of the actor that is not part of the skeleton. Burn a few NPCs, then look in the log for names such as fire or flame
; and put them in BurnKeywords.
DumpNodes=1
; Thrown by a blast (kicked faster than BalanceMaxSpeed): windmill, pedal or writhe in the air for ExplosionSeconds.
Explosion=1
ExplosionSeconds=1.6
ExplosionRollChance=0.3
ExplosionWritheChance=0.3
; Hit in the pelvis or lower spine: folds over and curls up as it goes down.
; Delirium for the player's own death ragdoll (third-person body). 0 = leave the player to the game.
; Delirium for the player's own death ragdoll (third-person body). It is only used when the game turns the player's skeleton into a ragdoll; the game's bodies are driven by velocity, never switched. 0 = leave the player to the game.
PlayerDeath=1
; DeathFallback: an actor (or you) that dies with no damage event, such as player.kill, a script kill, fall damage or poison, is started from its life state after 0.3 s, only when its bodies are
; really a ragdoll (dynamic). PlayerDeathCam: when you die in first person the camera is switched to third person so you see the ragdoll (the game only does it about 4 seconds later).
DeathFallback=1
PlayerDeathCam=1
; Living NPCs the game knocks down (explosion blast = knock state 1, knocked out = 3) get Delirium until the game starts getting them up.
Knockdown=1
; HitData: when an actor is damaged, read the game's hit data (hit location, weapon, flags) from the call stack. The log shows the first hits ("hit data:" lines) with the
; weapon's FormID, so you can fill the two lists below (hex FormIDs, comma separated, e.g. 0010C6D2,0010C6D3): a hit from a FireWeapons weapon makes the actor burn,
; from a ShockWeapons weapon makes it convulse. Empty = the old damage-tick guess for burning, no shock.
HitData=1
FireWeapons=
ShockWeapons=
; A knocked-down actor keeps fumbling on the floor (writhe, pedal, curl, with short limp pauses) until the game gets it up.
KnockAgony=1
; 0 = a knocked-out (state 3) actor just lies limp instead.
KnockOutAgony=1
; Actors the game has knocked unconscious (life state 3) are treated like knocked-out ones: they writhe for UnconsciousAgonySeconds, then lie limp and
; are handed back to the game; the session ends when they wake up.
Unconscious=1
UnconsciousAgonySeconds=6.0
; Stagger: a shot actor stumbles away from whoever shot it. WoundAgony: the agony follows the wound (gut, arm or head shot = curl up around it,
; leg shot = writhe and pedal with the good leg only).
Stagger=1
; FetalAgony: knocked-down and unconscious actors curl up (upper body in a foetal curl), kick their legs, and with HoldGut=1 reach for the wound; 0 = the older mix of writhing, rolling and curling.
FetalAgony=1
HoldGut=1
; Drown: an actor that dies with its feet more than DrownDepth metres under the water surface struggles for DrownSeconds (arms and legs thrashing), then sinks. The water cancels
; DrownBuoyancy of gravity (1 = floats, 0 = falls as in air) and slows it with DrownDrag. A [Drown] script block replaces the built-in reaction.
Drown=1
DrownDepth=0.9
DrownSeconds=6.0
DrownBuoyancy=0.92
DrownDrag=2.0
WoundAgony=1
; Length of one writhing spell, and the limp pause between spells (seconds).
KnockAgonySeconds=3.0
KnockAgonyPause=0.5
; Experimental: also start the player from the life state when the game gave no kill burst. Off: v0.15.1 crashed (R6025) with this on.
PlayerFallback=1
GutCurl=1
GutCurlChance=0.6
GutCurlSeconds=2.5
; Dying more than FallMinHeight units above the floor: arms flail on the way down, and with FallCatchChance it braces for the landing.
Fall=1
FallMinHeight=100
FallCatchChance=0.5
; Strength and size of the flailing, shared by all of the above.
FlailStiffness=12
FlailAmplitude=1.3
FlailPeriod=0.8

[EngineParams]
; Any parameter of the Delirium engine, written Task.parameter=value, applied at start-up and on every reload. For example:
; NMShot_Standing.shotBodyStiffness=14
; NMShot_Standing.shotLeanAmount=0.4
; (BalanceSteps overrides NMShot_Standing.shotMaxSteps on every kill.)
