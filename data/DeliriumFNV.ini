; DeliriumFNV settings. Needs FalloutNV.exe 1.4.0.525 and xNVSE.
[General]
Enabled=1
; Write the Delirium body into dying NPCs' bones. 0 = watch only, never touch the game.
Drive=1
; Only take over actors that are dying or dead (not knocked-down or essential NPCs). 0 = any ragdoll start.
RequireDead=1
; How many corpses can be simulated at the same time, seconds of simulation, then seconds the final pose is held.
MaxActors=4
SimSeconds=8
HoldSeconds=300
; Startup self test of the engine (3 s balance and a shot). Logs the result.
SmokeTest=0

; Hooks the plugin needs: the per-hit function and the motion-type setter (death detection), plus bhkWorld slots (any call tells
; the plugin which physics world is current). Format: Label=vtable,slot
[SlotProbes]
Character[206]=0x01086A6C,206
bhkBlendCollisionObject[44]=0x010C53DC,44
bhkWorld[50]=0x010C40B4,50
bhkWorld[2]=0x010C40B4,2
bhkWorld[10]=0x010C40B4,10
bhkWorld[20]=0x010C40B4,20
bhkWorld[30]=0x010C40B4,30
bhkWorld[40]=0x010C40B4,40
